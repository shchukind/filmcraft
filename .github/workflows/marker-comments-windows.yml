name: Marker comments Windows build

on:
  push:
    branches: [codex/marker-comments]
    paths:
      - .github/workflows/marker-comments-windows.yml
  workflow_dispatch:

permissions:
  contents: read

jobs:
  windows-x64:
    runs-on: windows-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-pc-windows-msvc
      - name: Install WiX 5
        shell: pwsh
        run: |
          dotnet tool install --global wix --version 5.0.2
          "$env:USERPROFILE\.dotnet\tools" >> $env:GITHUB_PATH
      - name: Build MSI and portable ZIP
        shell: pwsh
        run: pwsh -File packaging/windows/package.ps1 -Arch x64
      - uses: actions/upload-artifact@v4
        with:
          name: filmcraft-marker-comments-windows-x64
          path: |
            dist/release/filmcraft-0.9.0-windows-x64.msi
            dist/release/filmcraft-0.9.0-windows-x64-portable.zip
          if-no-files-found: error
